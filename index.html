<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>StudyFlow</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- ================= HEADER ================= -->

    <header class="header">

      <div class="brand">

        <div class="brand-icon">
          <i data-lucide="timer"></i>
        </div>

        <div>
          <h1>StudyFlow</h1>
          <p>Study smarter</p>
        </div>

      </div>

      <div class="header-date">

        <i data-lucide="calendar-days"></i>

        <span id="date">
          Sep 25, 2026
        </span>

      </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main>


      <!-- ================= TIMER ================= -->

      <section class="timer-section">

        <div class="timer-header">

          <div>
            <span class="eyebrow">
              <i data-lucide="target"></i>
              FOCUS
            </span>

            <h2>Study Timer</h2>
          </div>

          <div class="session-status" id="status">
            <span></span>
            Ready
          </div>

        </div>


        <!-- Circular Timer -->

        <div class="timer-wrapper">

          <svg
            class="timer-svg"
            viewBox="0 0 300 300"
          >

            <!-- Background Circle -->

            <circle
              class="timer-track"
              cx="150"
              cy="150"
              r="132"
            />

            <!-- Progress -->

            <circle
              class="timer-progress"
              id="timerProgress"
              cx="150"
              cy="150"
              r="132"
            />

          </svg>


          <div class="timer-content">

            <div class="timer-icon">
              <i data-lucide="book-open"></i>
            </div>

            <div
              class="timer-display"
              id="timer"
            >
              60:00
            </div>

            <span class="timer-label">
              Focus Time
            </span>

          </div>

        </div>


        <!-- Controls -->

        <div class="timer-controls">

          <button
            class="control-btn start"
            id="startBtn"
            title="Start"
          >
            <i data-lucide="play"></i>
            <span>Start</span>
          </button>

          <button
            class="control-btn pause"
            id="pauseBtn"
            title="Pause"
          >
            <i data-lucide="pause"></i>
            <span>Pause</span>
          </button>

          <button
            class="control-btn reset"
            id="resetBtn"
            title="Reset"
          >
            <i data-lucide="rotate-ccw"></i>
            <span>Reset</span>
          </button>

        </div>


        <!-- Presets -->

        <div class="presets">

          <button data-time="25">
            <i data-lucide="zap"></i>
            25m
          </button>

          <button data-time="50">
            <i data-lucide="zap"></i>
            50m
          </button>

          <button
            class="active"
            data-time="60"
          >
            <i data-lucide="zap"></i>
            60m
          </button>

          <button data-time="90">
            <i data-lucide="zap"></i>
            90m
          </button>

        </div>

      </section>


      <!-- ================= STATS ================= -->

      <section class="stats-grid">


        <div class="stat-card">

          <div class="stat-icon blue">
            <i data-lucide="book-open"></i>
          </div>

          <div>
            <span>Today</span>

            <strong id="todayStudy">
              0m
            </strong>
          </div>

        </div>


        <div class="stat-card">

          <div class="stat-icon green">
            <i data-lucide="target"></i>
          </div>

          <div>
            <span>Goal</span>

            <strong id="dailyGoal">
              120m
            </strong>
          </div>

        </div>


        <div class="stat-card">

          <div class="stat-icon orange">
            <i data-lucide="flame"></i>
          </div>

          <div>
            <span>Streak</span>

            <strong id="streak">
              0d
            </strong>
          </div>

        </div>


      </section>


      <!-- ================= PROGRESS ================= -->

      <section class="progress-card">

        <div class="progress-top">

          <div class="progress-title">

            <div class="progress-icon">
              <i data-lucide="chart-no-axes-column"></i>
            </div>

            <div>
              <span>Daily Progress</span>
              <small id="progressTime">
                0 min studied
              </small>
            </div>

          </div>


          <strong id="progressText">
            0%
          </strong>

        </div>


        <div class="progress-bar">

          <div
            class="progress-fill"
            id="progressFill"
          ></div>

        </div>


        <div class="progress-bottom">

          <span>
            <i data-lucide="clock-3"></i>
            <span id="remainingText">
              120 min left
            </span>
          </span>

          <span>
            <i data-lucide="flag"></i>
            <span id="goalText">
              120 min
            </span>
          </span>

        </div>

      </section>


      <!-- ================= GOAL ================= -->

      <section class="goal-card">

        <div class="goal-left">

          <div class="goal-icon">
            <i data-lucide="settings-2"></i>
          </div>

          <div>
            <strong>Daily Goal</strong>
            <span>Set your target</span>
          </div>

        </div>


        <div class="goal-input">

          <input
            type="number"
            id="goalInput"
            min="10"
            max="1440"
            value="120"
          >

          <span>min</span>

          <button id="saveGoal">
            <i data-lucide="check"></i>
          </button>

        </div>

      </section>


    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

      <span>
        <i data-lucide="heart"></i>
        Keep learning
      </span>

      <span>
        StudyFlow
      </span>

    </footer>

  </div>


  <script src="script.js"></script>

</body>
</html>
